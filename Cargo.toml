[package]
name = "armature-ferron"
version = "0.2.1"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-ferron"
homepage = "https://quinnjr.github.io/armature"
description = "Ferron reverse proxy integration for Armature"
keywords = ["ferron", "proxy", "reverse-proxy", "load-balancer"]
categories = ["web-programming", "network-programming"]

[dependencies]
# Core dependencies
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
async-trait = "0.1"

# Process management
nix = { version = "0.31", features = ["signal", "process"] }

# Health checking
reqwest = { version = "0.13", features = ["json"], default-features = false }

# File watching for config reload
notify = "8.2"

# URL parsing
url = "2.5"

# UUID for unique identifiers
uuid = { version = "1.23", features = ["v4"] }

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"
tempfile = "3.27"

[features]
default = []
# Enable native TLS for health checks
native-tls = ["reqwest/native-tls"]
# Enable rustls for health checks
rustls = ["reqwest/rustls"]

